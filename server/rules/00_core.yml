rules:
  - id: connect_after_exec
    technique: T1071
    severity: medium
    description: "Outbound connection within 3 s of the program starting (possible C2 callback)"
    where:
      - field: evt.type
        op: eq
        value: CONNECT
      - field: evt.detail
        op: not_matches
        value: ":53$"
      - field: since.exec
        op: lte
        value: 3.0
      # Network clients whose whole job is to connect right after starting.
      # Matched on the full exe path, so a copy at /tmp/curl still alerts.
      # Interpreters (python3, perl, bash) are deliberately not listed.
      - field: proc.exe
        op: not_matches
        value: '^(/usr)?/s?bin/(curl|wget|ping|ping6|git|ssh|scp|sftp|rsync|apt|apt-get|snap|dig|host|nslookup)$|^/usr/lib/(apt/methods|git-core)/|^/snap/|^/usr/lib/snapd/'

  - id: network_parent_shell
    technique: T1059
    severity: high
    description: "A process that made a network connection started a shell (possible reverse shell)"
    where:
      - field: evt.type
        op: eq
        value: EXEC
      - field: proc.exe_name
        op: in_set
        value: [sh, bash, dash, zsh, ksh, fish, busybox]
      - field: parent.net_connect_count
        op: gte
        value: 1

  - id: ptrace_then_exec
    technique: T1055
    severity: critical
    description: "ptrace attach followed by an exec within 3 s (possible process injection)"
    where:
      - field: evt.type
        op: eq
        value: EXEC
      - field: proc.ptrace_count
        op: gte
        value: 1
      - field: since.ptrace
        op: lte
        value: 3.0

  - id: suid_shell
    technique: T1548
    severity: high
    description: "Process changed uid and started a shell within 3 s (possible privilege escalation)"
    where:
      - field: evt.type
        op: eq
        value: EXEC
      - field: proc.setuid_count
        op: gte
        value: 1
      - field: since.setuid
        op: lte
        value: 3.0
      - field: proc.exe_name
        op: in_set
        value: [sh, bash, dash, zsh, ksh, fish, busybox]
